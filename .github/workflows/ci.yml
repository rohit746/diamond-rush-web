name: CI

on:
  push:
  pull_request:

jobs:
  build:
    # Diamondrush.jar is not in the repository, so CI checks what can be built without it (see tools/ci.sh).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: tools/deps/pom.xml
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: tools/ci.sh
